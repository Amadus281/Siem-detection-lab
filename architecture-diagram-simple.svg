  <!-- Arrows -->
  <path d="M260,195 L400,235" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M260,315 L400,275" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M620,255 L750,255" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Detections strip -->
  <line x1="60" y1="400" x2="940" y2="400" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="430" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Sudo Execution (T1548.003)  ·  Rootcheck Anomaly  ·  SCA Compliance Check  ·  SSH Brute Force (T1110)</text>
